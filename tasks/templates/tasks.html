<!DOCTYPE html>
<html>
    <head>
        <script src="https://cdn.tailwindcss.com"></script>
        <title>To Do</title>
    </head>
    <body>
        <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">
            <h1 class="text-2xl font-bold mb-2">Lista Task</h1>
            <ul>
                {% for task in tasks %}
                    <li>
                        <a href="/task/{{ task.id }}">
                            {{ task.title }}
                            {% if task.completed %}
                                ✅
                            {% else %}
                                ❌
                            {% endif %}
                        </a>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </body>
</html>
