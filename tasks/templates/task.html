<!DOCTYPE html>
<html>
<head>
    <title>To Do</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow">

    <h1 class="text-2xl font-bold mb-2">
        {{ task.title }}
    </h1>

    <p class="text-gray-600 mb-4">
        {{ task.description }}
    </p>

    <p>
        Stato:
        {% if task.completed %}
            <span class="text-green-500 font-semibold">Completato ✅</span>
        {% else %}
            <span class="text-red-500 font-semibold">Non completato ❌</span>
        {% endif %}
    </p>

    <a href="/" class="inline-block mt-4 text-blue-500 hover:underline">
        ← Torna alla lista
    </a>

</div>

</body>
</html>
